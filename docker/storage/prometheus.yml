global:
  scrape_interval: 15s          # как часто обходить цели

scrape_configs:
  - job_name: controller        # метка job, попадёт в каждую метрику цели
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: worker
    static_configs:
      - targets:
          - host.docker.internal:9101
          - host.docker.internal:9102
          - host.docker.internal:9103
          - host.docker.internal:9104
          - host.docker.internal:9105