apiVersion: batch/v1
kind: Job
metadata:
  name: simfleet-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: simfleet/migrate:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: simfleet-config }
            - secretRef:    { name: simfleet-secrets }